[project]
name = "herdr-mobile"
version = "0.1.0"
description = "Phone-friendly TUI for controlling Herdr coding agents over SSH"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "textual==8.2.8",
]

[project.scripts]
herdr-mobile = "herdr_mobile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["herdr_mobile"]
